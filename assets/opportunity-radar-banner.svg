<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">OpportunityRadar</title>
  <desc id="desc">A radar beam discovers opportunities beyond the obvious path.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop offset="0" stop-color="#071628"/>
      <stop offset="1" stop-color="#10334b"/>
    </linearGradient>
    <linearGradient id="beam" x2="1" y2="0">
      <stop offset="0" stop-color="#45e2c2" stop-opacity=".06"/>
      <stop offset="1" stop-color="#45e2c2" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="word" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c6e6ea"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#79c8c8" opacity=".17">
