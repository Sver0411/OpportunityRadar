<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">OpportunityRadar：从问题到值得看的机会</title>
  <desc id="desc">提出问题后，发现机会、核实官网、判断资格，最后得到下一步建议。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070708"/>
      <stop offset="1" stop-color="#242426"/>
    </linearGradient>
    <radialGradient id="light">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".07"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <style>
      .type { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .white { fill: #ffffff; }
      .secondary { fill: #c9c9cb; }
      .small { fill: #b5b5b8; }
    </style>
  </defs>
  <rect width="1200" height="540" rx="30" fill="url(#background)"/>
  <ellipse cx="1000" cy="60" rx="330" ry="200" fill="url(#light)" filter="url(#soft)"/>
  <ellipse cx="265" cy="520" rx="380" ry="170" fill="url(#light)" opacity=".45" filter="url(#soft)"/>

  <text x="64" y="57" class="type secondary" font-size="17" font-weight="600" letter-spacing="1">OpportunityRadar</text>
  <text x="64" y="113" class="type white" font-size="41" font-weight="650">从一个问题，找到值得看的机会</text>
  <text x="65" y="148" class="type secondary" font-size="19">找更多选择，查清重要信息，再告诉你先看哪个。</text>

  <rect x="64" y="176" width="1072" height="62" rx="19" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".36" filter="url(#shadow)"/>
  <circle cx="99" cy="207" r="13" fill="#ffffff" fill-opacity=".9"/>
  <text x="94" y="214" class="type" fill="#202022" font-size="20" font-weight="700">?</text>
  <text x="128" y="215" class="type white" font-size="23" font-weight="600">最近有什么适合我的机会？</text>

  <g fill="url(#glass)" stroke="#ffffff" stroke-opacity=".3" filter="url(#shadow)">
    <rect x="64" y="274" width="250" height="156" rx="23"/>
    <rect x="338" y="274" width="250" height="156" rx="23"/>
    <rect x="612" y="274" width="250" height="156" rx="23"/>
    <rect x="886" y="274" width="250" height="156" rx="23"/>
  </g>
  <g class="type">
    <text x="88" y="307" class="small" font-size="15" font-weight="600">01</text>
    <text x="362" y="307" class="small" font-size="15" font-weight="600">02</text>
    <text x="636" y="307" class="small" font-size="15" font-weight="600">03</text>
    <text x="910" y="307" class="small" font-size="15" font-weight="600">04</text>
    <text x="88" y="347" class="white" font-size="24" font-weight="650">找到更多机会</text>
    <text x="362" y="347" class="white" font-size="24" font-weight="650">核实官网信息</text>
    <text x="636" y="347" class="white" font-size="24" font-weight="650">判断能否申请</text>
    <text x="910" y="347" class="white" font-size="24" font-weight="650">给出下一步</text>
    <text x="88" y="382" class="secondary" font-size="17">工作、科研、比赛</text>
    <text x="88" y="408" class="secondary" font-size="17">奖学金、项目等</text>
    <text x="362" y="382" class="secondary" font-size="17">时间、条件</text>
    <text x="362" y="408" class="secondary" font-size="17">申请入口</text>
    <text x="636" y="382" class="secondary" font-size="17">与你的情况对照</text>
    <text x="636" y="408" class="secondary" font-size="17">不确定的明确标出</text>
    <text x="910" y="382" class="secondary" font-size="17">哪条先看</text>
    <text x="910" y="408" class="secondary" font-size="17">为什么值得看</text>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity=".55" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320 350h11m-5-5 5 5-5 5"/>
    <path d="M594 350h11m-5-5 5 5-5 5"/>
    <path d="M868 350h11m-5-5 5 5-5 5"/>
  </g>

  <text x="65" y="492" class="type secondary" font-size="18" font-weight="600">结果</text>
  <g class="type" font-size="17" font-weight="600">
    <rect x="132" y="457" width="277" height="51" rx="16" fill="#f1f1f2"/>
    <text x="155" y="490" fill="#1d1d1f">现在值得看</text>
    <rect x="425" y="457" width="277" height="51" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".28"/>
    <text x="448" y="490" class="white">还需要核实</text>
    <rect x="718" y="457" width="418" height="51" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".28"/>
    <text x="741" y="490" class="white">已过期或不符合</text>
  </g>
</svg>
